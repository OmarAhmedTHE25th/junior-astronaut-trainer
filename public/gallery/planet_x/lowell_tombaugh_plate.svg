<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="sepiaPlate">
      <feColorMatrix type="matrix" values="0.393 0.769 0.189 0 0  0.349 0.686 0.168 0 0  0.272 0.534 0.131 0 0  0 0 0 1 0"/>
    </filter>
  </defs>

  <!-- Photographic plate vintage emulsion dark tint -->
  <rect width="800" height="500" fill="#080706"/>

  <!-- Dual Photographic Glass Plates from February 1930 -->
  <!-- Plate A: February 18, 1930 -->
  <g transform="translate(60, 90)">
    <rect width="310" height="340" rx="4" fill="#14110e" stroke="#78350f" stroke-width="1.5"/>
    <text x="15" y="25" fill="#d97706" font-family="monospace" font-size="10" font-weight="bold">PLATE A: JAN 23, 1930 (DELTA GEM)</text>
    
    <!-- Stars on Plate A (Negative photographic emulsion: dark on light or bright points) -->
    <g fill="#fef3c7" opacity="0.8">
      <circle cx="50" cy="80" r="1.5"/>
      <circle cx="110" cy="140" r="1"/>
      <circle cx="90" cy="220" r="1.8"/>
      <circle cx="210" cy="70" r="2.2"/>
      <circle cx="270" cy="180" r="1.3"/>
      <circle cx="240" cy="280" r="1"/>
      <circle cx="70" cy="300" r="1.6"/>
      <!-- Pluto Position on Plate A -->
      <circle cx="150" cy="170" r="2.5" fill="#ffffff"/>
      <!-- Arrow pointer drawn by Clyde Tombaugh -->
      <line x1="130" y1="170" x2="142" y2="170" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="150" y1="150" x2="150" y2="162" stroke="#ef4444" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Plate B: January 29, 1930 -->
  <g transform="translate(430, 90)">
    <rect width="310" height="340" rx="4" fill="#14110e" stroke="#78350f" stroke-width="1.5"/>
    <text x="15" y="25" fill="#d97706" font-family="monospace" font-size="10" font-weight="bold">PLATE B: JAN 29, 1930 (DELTA GEM)</text>
    
    <!-- Identical background stars -->
    <g fill="#fef3c7" opacity="0.8">
      <circle cx="50" cy="80" r="1.5"/>
      <circle cx="110" cy="140" r="1"/>
      <circle cx="90" cy="220" r="1.8"/>
      <circle cx="210" cy="70" r="2.2"/>
      <circle cx="270" cy="180" r="1.3"/>
      <circle cx="240" cy="280" r="1"/>
      <circle cx="70" cy="300" r="1.6"/>
      <!-- Shifted Pluto Position on Plate B (Blink displacement of 3.5 millimeters!) -->
      <circle cx="168" cy="170" r="2.5" fill="#ffffff"/>
      <!-- Arrow pointer drawn by Clyde Tombaugh -->
      <line x1="186" y1="170" x2="174" y2="170" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="168" y1="150" x2="168" y2="162" stroke="#ef4444" stroke-width="1.5"/>
    </g>
    <text x="120" y="200" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">Δx = 3.5 mm SHIFT</text>
  </g>

  <!-- Zeiss Blink Comparator Center Indicator -->
  <g transform="translate(400, 260)">
    <circle cx="0" cy="0" r="22" fill="#1e1b18" stroke="#d97706" stroke-width="1.5"/>
    <text x="-9" y="5" fill="#d97706" font-family="sans-serif" font-size="14" font-weight="900">⇄</text>
  </g>

  <!-- Telemetry / History Badge -->
  <rect x="25" y="20" width="410" height="50" rx="8" fill="#14110e" fill-opacity="0.95" stroke="#d97706" stroke-width="1.5"/>
  <text x="40" y="42" fill="#d97706" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">LOWELL OBSERVATORY // 13-INCH PLUTO CAMERA</text>
  <text x="40" y="58" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900">CLYDE TOMBAUGH 1930 BLINK DISCOVERY PLATES</text>
</svg>