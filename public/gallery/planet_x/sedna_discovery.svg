<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="deepSednaSpace" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0510"/>
      <stop offset="70%" stop-color="#040207"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="sednaGlobe" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#b91c1c"/>
      <stop offset="75%" stop-color="#7f1d1d"/>
      <stop offset="95%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0505"/>
    </radialGradient>
    <filter id="sednaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#deepSednaSpace)"/>

  <!-- Star field background (Palomar 48-inch Schmidt Telescope plate style) -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="90" r="1.5"/>
    <circle cx="140" cy="120" r="0.8"/>
    <circle cx="190" cy="70" r="1.2"/>
    <circle cx="270" cy="110" r="1"/>
    <circle cx="350" cy="60" r="2"/>
    <circle cx="580" cy="95" r="1.2"/>
    <circle cx="690" cy="75" r="1.5"/>
    <circle cx="730" cy="140" r="0.8"/>
    <circle cx="110" cy="380" r="1"/>
    <circle cx="220" cy="420" r="1.3"/>
    <circle cx="670" cy="410" r="1.8"/>
    <circle cx="740" cy="360" r="1"/>
  </g>

  <!-- Distant Dim Sun (at 90 AU distance, shining as a bright point of light) -->
  <g transform="translate(180, 160)">
    <circle cx="0" cy="0" r="10" fill="#fef08a" opacity="0.3" filter="url(#sednaGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <!-- Solar rays cross -->
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#fef08a" stroke-width="1" opacity="0.8"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#fef08a" stroke-width="1" opacity="0.8"/>
    <text x="15" y="15" fill="#fde047" font-family="monospace" font-size="9">THE SUN (AS SEEN FROM 90 AU)</text>
  </g>

  <!-- 90377 Sedna Body (One of the reddest objects in the solar system due to tholins) -->
  <g transform="translate(480, 260)">
    <!-- Shadow side & terminator -->
    <circle cx="0" cy="0" r="95" fill="url(#sednaGlobe)"/>
    
    <!-- Organic tholin reddish cratering & frost patches -->
    <path d="M-40,-30 Q-10,-50 30,-20 Q10,10 -30,0 Z" fill="#991b1b" opacity="0.6"/>
    <path d="M-60,10 Q-20,30 10,60 Q-30,70 -60,40 Z" fill="#7f1d1d" opacity="0.8"/>
    <circle cx="15" cy="-35" r="12" fill="#fca5a5" opacity="0.4"/>
    <circle cx="-15" cy="45" r="8" fill="#f87171" opacity="0.3"/>

    <!-- Reticle Crosshair tracking markers -->
    <g stroke="#f43f5e" stroke-width="1" opacity="0.6" fill="none">
      <circle cx="0" cy="0" r="120" stroke-dasharray="8,6"/>
      <line x1="-140" y1="0" x2="-105" y2="0"/>
      <line x1="105" y1="0" x2="140" y2="0"/>
      <line x1="0" y1="-140" x2="0" y2="-105"/>
      <line x1="0" y1="105" x2="0" y2="140"/>
    </g>
  </g>

  <!-- Palomar / Spitzer Discovery Telemetry Box -->
  <rect x="25" y="25" width="350" height="50" rx="8" fill="#0b1329" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="40" y="47" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">PALOMAR OBSERVATORY // 90377 SEDNA</text>
  <text x="40" y="63" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900">DETACHED INNER OORT CLOUD BODY (2003)</text>
</svg>