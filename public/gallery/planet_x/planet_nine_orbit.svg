<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="deepOuterSpace" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#070a1a"/>
      <stop offset="60%" stop-color="#03040c"/>
      <stop offset="100%" stop-color="#000105"/>
    </radialGradient>
    <filter id="p9glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#deepOuterSpace)"/>

  <!-- Distant Kuiper belt stars -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="90" cy="80" r="0.8"/>
    <circle cx="160" cy="40" r="1.2"/>
    <circle cx="280" cy="95" r="0.8"/>
    <circle cx="490" cy="45" r="1.5"/>
    <circle cx="680" cy="70" r="1"/>
    <circle cx="730" cy="140" r="1.3"/>
    <circle cx="70" cy="380" r="1"/>
    <circle cx="210" cy="440" r="1.4"/>
    <circle cx="660" cy="410" r="0.8"/>
    <circle cx="740" cy="370" r="1.1"/>
  </g>

  <!-- Sun at gravitational center -->
  <circle cx="360" cy="250" r="6" fill="#fef08a" filter="url(#p9glow)"/>
  <circle cx="360" cy="250" r="3" fill="#ffffff"/>
  <text x="350" y="275" fill="#fef08a" font-family="monospace" font-size="10" font-weight="bold">SUN (1 AU)</text>

  <!-- Known Outer Planets Inner Orbit Rings (Neptune 30 AU in cyan) -->
  <ellipse cx="360" cy="250" rx="40" ry="25" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <text x="375" y="235" fill="#38bdf8" font-family="monospace" font-size="8">NEPTUNE 30 AU</text>

  <!-- Clustered Extreme Trans-Neptunian Objects (Sedna, 2012 VP113, etc.) tilted right -->
  <!-- Orbit 1: Sedna (90377) -->
  <ellipse cx="490" cy="250" rx="150" ry="60" fill="none" stroke="#ec4899" stroke-width="1.5" transform="rotate(-15 360 250)" opacity="0.85"/>
  <circle cx="630" cy="210" r="3.5" fill="#ec4899"/>
  <text x="640" y="215" fill="#f472b6" font-family="monospace" font-size="9" font-weight="bold">SEDNA (76–937 AU)</text>

  <!-- Orbit 2: 2012 VP113 ('Biden') -->
  <ellipse cx="470" cy="260" rx="130" ry="50" fill="none" stroke="#a855f7" stroke-width="1.3" transform="rotate(-8 360 250)" opacity="0.8"/>
  <circle cx="585" cy="275" r="3" fill="#a855f7"/>
  <text x="595" y="280" fill="#c084fc" font-family="monospace" font-size="8.5">2012 VP113</text>

  <!-- Orbit 3: 2004 VN112 -->
  <ellipse cx="480" cy="245" rx="140" ry="55" fill="none" stroke="#818cf8" stroke-width="1.2" transform="rotate(-22 360 250)" opacity="0.75"/>
  
  <!-- Orbit 4: 2010 GB174 -->
  <ellipse cx="460" cy="255" rx="120" ry="45" fill="none" stroke="#60a5fa" stroke-width="1.2" transform="rotate(-4 360 250)" opacity="0.7"/>

  <!-- PREDICTED PLANET NINE ECCENTRIC ORBIT (Anti-aligned to the clustered eTNOs, pointing left) -->
  <ellipse cx="200" cy="250" rx="210" ry="110" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6,4" transform="rotate(160 360 250)" filter="url(#p9glow)"/>
  
  <!-- Planet Nine Location Marker -->
  <g transform="translate(100, 230)">
    <circle cx="0" cy="0" r="14" fill="#0891b2" opacity="0.4" filter="url(#p9glow)"/>
    <circle cx="0" cy="0" r="8" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-2" cy="-2" r="2.5" fill="#ffffff" opacity="0.8"/>
    <text x="15" y="-5" fill="#22d3ee" font-family="sans-serif" font-size="12" font-weight="900">PLANET NINE (HYPOTHESIZED)</text>
    <text x="15" y="10" fill="#a5f3fc" font-family="monospace" font-size="9">Mass: 5–10 M⊕ • Semi-Major: ~400–800 AU</text>
  </g>

  <!-- Astronomical Coordinate Scale Indicator -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.4" font-family="monospace" font-size="8" fill="#ffffff">
    <line x1="360" y1="460" x2="560" y2="460"/>
    <line x1="360" y1="455" x2="360" y2="465"/>
    <line x1="560" y1="455" x2="560" y2="465"/>
    <text x="430" y="475">SCALE: 200 AU</text>
  </g>

  <!-- Technical Dossier Badge -->
  <rect x="25" y="25" width="340" height="50" rx="8" fill="#0b1329" fill-opacity="0.9" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="40" y="47" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">BATYGIN &amp; BROWN (2016) ASTRON. J.</text>
  <text x="40" y="63" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900">EXTREME TNO ORBITAL ALIGNMENT</text>
</svg>