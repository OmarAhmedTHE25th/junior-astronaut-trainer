<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#0b1730"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunburst" cx="70%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="cityGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="800" height="500" fill="url(#nightSky)"/>

  <!-- Earth curved limb from ISS altitude -->
  <path d="M-50,280 Q400,200 850,280 L850,550 L-50,550 Z" fill="#040814"/>

  <!-- Thin atmospheric blue glow ribbon -->
  <path d="M-50,280 Q400,200 850,280 L850,295 Q400,215 -50,295 Z" fill="url(#horizonGlow)"/>
  
  <!-- Orbital sunrise focal burst on the horizon -->
  <circle cx="580" cy="235" r="90" fill="url(#sunburst)"/>
  <ellipse cx="580" cy="235" rx="140" ry="8" fill="#ffffff" opacity="0.8"/>

  <!-- City lights networks glowing in warm gold on the night surface -->
  <g fill="#f59e0b" filter="url(#cityGlow)" opacity="0.85">
    <!-- Metropolitan cluster 1 (e.g. Nile delta / Mediterranean coast) -->
    <circle cx="210" cy="340" r="3"/>
    <circle cx="215" cy="343" r="2.5"/>
    <circle cx="225" cy="338" r="4"/>
    <circle cx="232" cy="345" r="3"/>
    <path d="M210,340 L240,360 L230,375 L200,355 Z" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.6"/>
    
    <!-- Metropolitan cluster 2 (Western Europe / East Coast Megalopolis) -->
    <circle cx="340" cy="310" r="4.5"/>
    <circle cx="350" cy="305" r="3"/>
    <circle cx="360" cy="315" r="3.5"/>
    <circle cx="380" cy="320" r="5"/>
    <circle cx="395" cy="315" r="3"/>
    <path d="M330,315 L360,310 L380,320 L410,330" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
    <path d="M360,310 L350,335 L370,350 L390,340" stroke="#f59e0b" stroke-width="1" fill="none"/>

    <!-- Highway spiderweb conduits -->
    <line x1="232" y1="345" x2="340" y2="310" stroke="#fde047" stroke-width="0.8" opacity="0.7"/>
    <line x1="380" y1="320" x2="490" y2="330" stroke="#fde047" stroke-width="0.8" opacity="0.6"/>

    <!-- Secondary coastal ports -->
    <circle cx="490" cy="330" r="3.5"/>
    <circle cx="510" cy="335" r="2.5"/>
    <circle cx="160" cy="365" r="2"/>
    <circle cx="280" cy="360" r="2.5"/>
  </g>

  <!-- ISS Truss & Solar Array Silhouette in upper foreground -->
  <g fill="#0f172a" stroke="#334155" stroke-width="1.5">
    <!-- Solar panel wing mast -->
    <rect x="0" y="30" width="180" height="40" rx="3" fill="#090d16" stroke="#475569"/>
    <!-- Solar cells grid pattern -->
    <line x1="30" y1="30" x2="30" y2="70" stroke="#38bdf8" stroke-width="0.7" opacity="0.7"/>
    <line x1="60" y1="30" x2="60" y2="70" stroke="#38bdf8" stroke-width="0.7" opacity="0.7"/>
    <line x1="90" y1="30" x2="90" y2="70" stroke="#38bdf8" stroke-width="0.7" opacity="0.7"/>
    <line x1="120" y1="30" x2="120" y2="70" stroke="#38bdf8" stroke-width="0.7" opacity="0.7"/>
    <line x1="150" y1="30" x2="150" y2="70" stroke="#38bdf8" stroke-width="0.7" opacity="0.7"/>
    <line x1="0" y1="50" x2="180" y2="50" stroke="#38bdf8" stroke-width="0.7" opacity="0.7"/>
    <!-- Truss boom -->
    <rect x="180" y="45" width="70" height="10" fill="#1e293b"/>
  </g>

  <!-- Telemetry Badge -->
  <rect x="25" y="425" width="280" height="50" rx="8" fill="#0b1329" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="40" y="447" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">ISS EXPEDITION 65 // CUPOLA</text>
  <text x="40" y="463" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900">ORBITAL SUNRISE &amp; CITY LIGHTS</text>
</svg>