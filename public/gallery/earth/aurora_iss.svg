<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="nightVoid" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#020510"/>
      <stop offset="100%" stop-color="#000105"/>
    </radialGradient>
    <linearGradient id="auroraEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="auroraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="800" height="500" fill="url(#nightVoid)"/>
  
  <!-- Subtle stars in background -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="80" r="1"/>
    <circle cx="160" cy="50" r="1.5"/>
    <circle cx="280" cy="90" r="0.8"/>
    <circle cx="450" cy="40" r="1.2"/>
    <circle cx="620" cy="70" r="1"/>
    <circle cx="720" cy="110" r="1.4"/>
  </g>

  <!-- Curved night limb of the Earth -->
  <path d="M-50,330 Q400,240 850,330 L850,550 L-50,550 Z" fill="#040916"/>
  
  <!-- Airglow thin gold line on the horizon -->
  <path d="M-50,330 Q400,240 850,330" stroke="#f59e0b" stroke-width="2.5" opacity="0.7"/>

  <!-- High-altitude Violet Oxygen Aurora curtain -->
  <path d="M50,220 Q200,160 380,200 Q560,170 750,230 L750,280 Q560,210 380,250 Q200,210 50,270 Z" fill="url(#auroraViolet)" filter="url(#auroraGlow)"/>

  <!-- Dancing Emerald Green Aurora Ribbon Curtain -->
  <g filter="url(#auroraGlow)">
    <!-- Primary lower ribbon -->
    <path d="M0,260 Q180,180 340,230 Q500,190 800,250 L800,320 Q500,240 340,280 Q180,230 0,310 Z" fill="url(#auroraEmerald)"/>
    <!-- Folded curtain ray pillars -->
    <path d="M120,190 L140,290 M160,180 L175,285 M240,170 L250,280 M320,190 L330,290 M420,180 L425,280 M510,175 L520,285 M610,190 L615,290 M690,205 L695,295" stroke="#34d399" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- City lights sparkling dimly beneath the aurora through the clouds -->
  <g fill="#fde68a" opacity="0.75">
    <circle cx="280" cy="390" r="3"/>
    <circle cx="295" cy="385" r="2.5"/>
    <circle cx="310" cy="395" r="3.5"/>
    <circle cx="340" cy="400" r="2"/>
    <circle cx="520" cy="410" r="3"/>
    <circle cx="535" cy="405" r="2.5"/>
    <circle cx="550" cy="415" r="4"/>
  </g>

  <!-- ISS Cupola window structure outline in foreground -->
  <path d="M0,450 L120,400 L250,500 L0,500 Z" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  <path d="M800,450 L680,400 L550,500 L800,500 Z" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- Telemetry Badge -->
  <rect x="25" y="25" width="280" height="50" rx="8" fill="#0b1329" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <text x="40" y="47" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">ISS EXPEDITION 64 // GEOMAGNETIC</text>
  <text x="40" y="63" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900">AURORA AUSTRALIS CURTAIN</text>
</svg>