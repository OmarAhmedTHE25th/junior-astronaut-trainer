<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="oceanSurface" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e3870"/>
      <stop offset="60%" stop-color="#082247"/>
      <stop offset="100%" stop-color="#030e21"/>
    </radialGradient>
    <radialGradient id="eyeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#010714"/>
      <stop offset="70%" stop-color="#04122d"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="swirlBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Deep Ocean Blue Foundation -->
  <rect width="800" height="500" fill="url(#oceanSurface)"/>

  <!-- Atmospheric Limb curvature on top right -->
  <path d="M-100,50 Q450,20 900,-30 L900,-100 L-100,-100 Z" fill="#000511"/>
  <path d="M-100,50 Q450,20 900,-30" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>

  <!-- Category 5 Super Typhoon Outer Feeder Bands -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.85">
    <!-- Spiral feeder band 1 -->
    <path d="M120,440 Q250,420 340,360 Q450,280 430,220 Q410,180 370,190" stroke-width="34" opacity="0.6" filter="url(#swirlBlur)"/>
    <!-- Spiral feeder band 2 -->
    <path d="M680,410 Q600,340 510,310 Q400,280 360,240 Q340,200 370,180" stroke-width="28" opacity="0.7"/>
    <!-- Spiral feeder band 3 -->
    <path d="M620,110 Q500,120 420,160 Q350,210 380,260 Q410,290 440,260" stroke-width="22" opacity="0.75"/>
    <!-- Spiral feeder band 4 -->
    <path d="M180,140 Q260,160 330,190 Q390,220 420,240" stroke-width="18" opacity="0.8"/>
  </g>

  <!-- Dense Central Dense Overcast (CDO) Shield -->
  <circle cx="400" cy="230" r="140" fill="#ffffff" opacity="0.9" filter="url(#swirlBlur)"/>
  <circle cx="400" cy="230" r="125" fill="#f8fafc" opacity="0.95"/>

  <!-- Stadium-Effect Eyewall Cloud Ridge -->
  <circle cx="400" cy="230" r="45" fill="none" stroke="#e2e8f0" stroke-width="12" opacity="0.9"/>
  <circle cx="400" cy="230" r="38" fill="none" stroke="#cbd5e1" stroke-width="6"/>

  <!-- The Eye of the Storm (Looking straight down to calm dark ocean surface) -->
  <circle cx="400" cy="230" r="28" fill="url(#eyeShadow)"/>
  <circle cx="400" cy="230" r="20" fill="#04122d"/>

  <!-- Atmospheric Pressure Isobar Overlay Grid -->
  <g stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4" fill="none">
    <circle cx="400" cy="230" r="90"/>
    <circle cx="400" cy="230" r="170"/>
    <circle cx="400" cy="230" r="250"/>
  </g>

  <!-- Telemetry Badge -->
  <rect x="25" y="25" width="280" height="50" rx="8" fill="#0b1329" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="40" y="47" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">NASA EARTH OBSERVATORY // MODIS</text>
  <text x="40" y="63" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900">CATEGORY 5 VORTEX EYEWALL</text>
</svg>